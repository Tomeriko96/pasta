<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900"
     font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#fdf8f0"/>
    <stop offset="60%"  stop-color="#f7edda"/>
    <stop offset="100%" stop-color="#ede0c0"/>
  </linearGradient>
  <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#4a0808"/>
    <stop offset="50%"  stop-color="#7a1515"/>
    <stop offset="100%" stop-color="#5c0e0e"/>
  </linearGradient>
  <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#f0c060"/>
    <stop offset="50%"  stop-color="#d4a843"/>
    <stop offset="100%" stop-color="#b8922a"/>
  </linearGradient>
  <linearGradient id="darkBadge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#4a0808"/>
    <stop offset="100%" stop-color="#2e0505"/>
  </linearGradient>
  <linearGradient id="goldBadge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#b8922a"/>
    <stop offset="100%" stop-color="#7a5c18"/>
  </linearGradient>
  <linearGradient id="featuredBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#fffbf0"/>
    <stop offset="100%" stop-color="#fdf0d5"/>
  </linearGradient>
  <pattern id="grain" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.6" fill="#8b6914" opacity="0.07"/>
    <circle cx="4" cy="4" r="0.6" fill="#8b6914" opacity="0.05"/>
  </pattern>
  <filter id="shadow">
    <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000025"/>
  </filter>
</defs>

<!-- BACKGROUND -->
<rect width="800" height="900" fill="url(#bgGrad)"/>
<rect width="800" height="900" fill="url(#grain)"/>

<!-- borders -->
<rect x="10" y="10" width="780" height="880" rx="7" fill="none" stroke="#8b6914" stroke-width="2.5" filter="url(#shadow)"/>
<rect x="16" y="16" width="768" height="868" rx="5" fill="none" stroke="#c8a96e" stroke-width="1"/>

