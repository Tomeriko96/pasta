<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720"
     font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif">
<defs>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#7a5010"/>
    <stop offset="30%"  stop-color="#9b6820"/>
    <stop offset="70%"  stop-color="#8b5c14"/>
    <stop offset="100%" stop-color="#6a4008"/>
  </linearGradient>
  <linearGradient id="woodV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#a07828"/>
    <stop offset="100%" stop-color="#6a4008"/>
  </linearGradient>
  <linearGradient id="board" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%"   stop-color="#1e3020"/>
    <stop offset="50%"  stop-color="#162618"/>
    <stop offset="100%" stop-color="#1a2c1c"/>
  </linearGradient>
  <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#f0c060"/>
    <stop offset="100%" stop-color="#b8922a"/>
  </linearGradient>
  <filter id="chalk">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
    <feComposite in="SourceGraphic" in2="noise" operator="in"/>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="1.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- ── SHADOW ── -->
<ellipse cx="244" cy="714" rx="180" ry="8" fill="#00000033"/>

<!-- ── A-FRAME LEGS ── -->
<!-- left leg -->
<polygon points="82,526 104,526 58,706 36,706" fill="url(#wood)"/>
<polygon points="84,526 96,526 54,686 42,686" fill="#c8a030" opacity="0.15"/>
<!-- right leg -->
<polygon points="376,526 398,526 444,706 422,706" fill="url(#wood)"/>
<polygon points="384,526 396,526 440,686 428,686" fill="#c8a030" opacity="0.15"/>
<!-- crossbar -->
<rect x="58" y="618" width="366" height="14" rx="5" fill="url(#woodV)"/>
<rect x="58" y="618" width="366" height="4"  rx="5" fill="#f0c060" opacity="0.2"/>

<!-- ── BOARD OUTER FRAME ── -->
<rect x="56" y="8" width="368" height="524" rx="10" fill="url(#wood)"/>
<!-- wood grain lines -->
<line x1="72"  y1="10" x2="72"  y2="530" stroke="#6a4008" stroke-width="1" opacity="0.4"/>
<line x1="98"  y1="10" x2="98"  y2="530" stroke="#9b6820" stroke-width="0.5" opacity="0.2"/>
<line x1="386" y1="10" x2="386" y2="530" stroke="#6a4008" stroke-width="1" opacity="0.4"/>
<line x1="410" y1="10" x2="410" y2="530" stroke="#9b6820" stroke-width="0.5" opacity="0.2"/>

<!-- ── HINGE at top ── -->
<rect x="228" y="2" width="24" height="20" rx="4" fill="#c8a030"/>
<rect x="232" y="4" width="16" height="16" rx="3" fill="#f0c060"/>
<circle cx="240" cy="12" r="3" fill="#8b6914"/>
<!-- hinge screws -->
<circle cx="234" cy="7"  r="1.5" fill="#6b5010"/>
<circle cx="246" cy="7"  r="1.5" fill="#6b5010"/>
<circle cx="234" cy="17" r="1.5" fill="#6b5010"/>
<circle cx="246" cy="17" r="1.5" fill="#6b5010"/>

<!-- ── CHALKBOARD SURFACE ── -->
<rect x="72" y="24" width="336" height="492" rx="5" fill="url(#board)"/>

<!-- chalk texture overlay -->
<rect x="72" y="24" width="336" height="492" rx="5" fill="none"
      stroke="#ffffff" stroke-width="1" opacity="0.08"/>

<!-- inner chalk border — double line -->
<rect x="82"  y="34"  width="316" height="472" rx="4" fill="none" stroke="#e8e0c8" stroke-width="1.8" opacity="0.35"/>
<rect x="87"  y="39"  width="306" height="462" rx="3" fill="none" stroke="#e8e0c8" stroke-width="0.8" opacity="0.22"/>

<!-- corner ornament chalk sketches -->
<g opacity="0.45" stroke="#e8e0c8" fill="none" stroke-width="1.2">
  <!-- TL corner -->
  <path d="M86,38 Q94,38 94,46"/>
  <path d="M86,48 Q86,38 96,38"/>
  <!-- TR corner -->
  <path d="M394,38 Q386,38 386,46"/>
  <path d="M394,48 Q394,38 384,38"/>
  <!-- BL corner -->
  <path d="M86,502 Q94,502 94,494"/>
  <path d="M86,492 Q86,502 96,502"/>
  <!-- BR corner -->
  <path d="M394,502 Q386,502 386,494"/>
  <path d="M394,492 Q394,502 384,502"/>
</g>

<!-- ════════════════════════════════
     CHALK CONTENT
════════════════════════════════ -->

<!-- Restaurant name -->
<text x="240" y="82" text-anchor="middle" font-size="36" font-weight="bold"
      fill="#f5f0e0" opacity="0.95" font-style="italic" letter-spacing="2"
      filter="url(#glow)">La Bella Pasta</text>
<text x="240" y="100" text-anchor="middle" font-size="11" fill="#d4c890"
      opacity="0.8" letter-spacing="3">RISTORANTE ITALIANO</text>

<!-- Stars row -->
<text x="240" y="120" text-anchor="middle" font-size="14" fill="#f0c060"
      opacity="0.9" letter-spacing="4">★  ★  ★  ★  ★</text>

<!-- Italian flag chalk strip -->
<rect x="94"  y="130" width="97"  height="7" rx="2" fill="#009246" opacity="0.7"/>
<rect x="191" y="130" width="98"  height="7"        fill="#ffffff" opacity="0.55"/>
<rect x="289" y="130" width="97"  height="7" rx="2" fill="#ce2b37" opacity="0.7"/>

<!-- Chalk divider flourish -->
<line x1="96"  y1="148" x2="186" y2="148" stroke="#e8e0c8" stroke-width="1" opacity="0.5"/>
<line x1="294" y1="148" x2="384" y2="148" stroke="#e8e0c8" stroke-width="1" opacity="0.5"/>
<text x="240" y="153" text-anchor="middle" font-size="12" fill="#e8e0c8" opacity="0.55">✦</text>

<!-- Section heading -->
<text x="240" y="175" text-anchor="middle" font-size="15" fill="#f5f0e0"
      opacity="0.85" letter-spacing="3" style="font-variant:small-caps;">Paste del Giorno</text>

<!-- Dotted line separator -->
<line x1="96" y1="184" x2="384" y2="184" stroke="#e8e0c8" stroke-width="0.8"
      stroke-dasharray="3,5" opacity="0.4"/>

<!-- Dish listings (chalk style — name dots price) -->
<!-- row helper: name left, dots, price right -->
<text x="100" y="205" font-size="13.5" fill="#f5f0e0" opacity="0.9" font-style="italic">Spaghetti Carbonara</text>
<line x1="284" y1="202" x2="352" y2="202" stroke="#e8e0c8" stroke-width="0.7" stroke-dasharray="2,4" opacity="0.35"/>
<text x="382" y="205" text-anchor="end" font-size="13.5" fill="#f0c060" opacity="0.95" font-weight="bold">€14.50</text>

<text x="100" y="228" font-size="13.5" fill="#f5f0e0" opacity="0.9" font-style="italic">Lasagna della Nonna</text>
<line x1="288" y1="225" x2="352" y2="225" stroke="#e8e0c8" stroke-width="0.7" stroke-dasharray="2,4" opacity="0.35"/>
<text x="382" y="228" text-anchor="end" font-size="13.5" fill="#f0c060" opacity="0.95" font-weight="bold">€15.50</text>

<text x="100" y="251" font-size="13.5" fill="#f5f0e0" opacity="0.9" font-style="italic">Tagliatelle Bolognese</text>
<line x1="290" y1="248" x2="352" y2="248" stroke="#e8e0c8" stroke-width="0.7" stroke-dasharray="2,4" opacity="0.35"/>
<text x="382" y="251" text-anchor="end" font-size="13.5" fill="#f0c060" opacity="0.95" font-weight="bold">€15.00</text>

<text x="100" y="274" font-size="13.5" fill="#f5f0e0" opacity="0.9" font-style="italic">Pappardelle Porcini</text>
<line x1="274" y1="271" x2="352" y2="271" stroke="#e8e0c8" stroke-width="0.7" stroke-dasharray="2,4" opacity="0.35"/>
<text x="382" y="274" text-anchor="end" font-size="13.5" fill="#f0c060" opacity="0.95" font-weight="bold">€16.50</text>

<text x="100" y="297" font-size="13.5" fill="#f5f0e0" opacity="0.9" font-style="italic">Risotto Frutti di Mare</text>
<line x1="295" y1="294" x2="352" y2="294" stroke="#e8e0c8" stroke-width="0.7" stroke-dasharray="2,4" opacity="0.35"/>
<text x="382" y="297" text-anchor="end" font-size="13.5" fill="#f0c060" opacity="0.95" font-weight="bold">€19.00</text>

<!-- chalk divider -->
<line x1="96" y1="311" x2="384" y2="311" stroke="#e8e0c8" stroke-width="0.8"
      stroke-dasharray="3,5" opacity="0.4"/>

<!-- Chalk pasta sketch — plate with spaghetti + fork -->
<g transform="translate(240,358)" opacity="0.38" stroke="#e8e0c8" fill="none" stroke-linecap="round">
  <!-- plate -->
  <circle cx="0" cy="0" r="38" stroke-width="2"/>
  <circle cx="0" cy="0" r="30" stroke-width="1" opacity="0.6"/>
  <!-- spaghetti on plate -->
  <path d="M-22,4 Q-10,-12 4,4 Q16,14 22,4" stroke-width="2.2"/>
  <path d="M-20,-4 Q-6,-18 8,-2 Q20,8 20,-4" stroke-width="2.2"/>
  <path d="M-18,12 Q-4,0 10,14 Q22,22 20,12" stroke-width="1.8"/>
  <!-- fork -->
  <line x1="46" y1="-24" x2="46" y2="24" stroke-width="2"/>
  <line x1="42" y1="-24" x2="42" y2="-8" stroke-width="1.4"/>
  <line x1="50" y1="-24" x2="50" y2="-8" stroke-width="1.4"/>
  <line x1="42" y1="-8"  x2="50" y2="-8"  stroke-width="1.4"/>
  <!-- steam -->
  <path d="M-8,-44 Q-4,-52 -8,-58" stroke-width="1.4" opacity="0.6"/>
  <path d="M0,-46 Q4,-54 0,-62" stroke-width="1.4" opacity="0.6"/>
  <path d="M8,-44 Q12,-52 8,-58" stroke-width="1.4" opacity="0.6"/>
</g>

<!-- Free bread offer -->
<rect x="98" y="386" width="284" height="28" rx="5" fill="#ffffff" opacity="0.08"/>
<text x="240" y="404" text-anchor="middle" font-size="12" fill="#f5f0e0" opacity="0.9">🥖  Pane gratis con ogni pasto</text>

<!-- TripAdvisor line -->
<text x="240" y="432" text-anchor="middle" font-size="11" fill="#e8d888" opacity="0.85">⭐ TripAdvisor #1  ·  4.8/5  ·  3.200+ recensioni</text>

<!-- chalk divider -->
<line x1="96" y1="444" x2="384" y2="444" stroke="#e8e0c8" stroke-width="0.8" stroke-dasharray="3,5" opacity="0.35"/>

<!-- CTA arrow -->
<text x="240" y="468" text-anchor="middle" font-size="20" fill="#f5f0e0" opacity="0.9"
      font-style="italic" font-weight="bold">Entra qui!</text>
<!-- hand-drawn arrow -->
<path d="M180,476 Q240,490 300,476" stroke="#f0c060" stroke-width="2" fill="none"
      stroke-linecap="round" opacity="0.8"/>
<path d="M292,469 L300,476 L288,480" stroke="#f0c060" stroke-width="2" fill="none"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
<path d="M188,469 L180,476 L192,480" stroke="#f0c060" stroke-width="2" fill="none"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

<!-- Address bottom -->
<text x="240" y="500" text-anchor="middle" font-size="10" fill="#d4c890"
      opacity="0.7" letter-spacing="1">Via Roma 12  ·  12:00–22:30  ·  @labellaspasta</text>
</svg>
