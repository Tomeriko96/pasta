name: Deploy site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble public site
        run: |
          mkdir -p _site
          cp index.html favicon.svg attract.html CNAME .nojekyll _site/
          cp attract-authentic-loop.mp4 attract-authentic-QR-loop.mp4 attract-v12-white-loop.mp4 _site/
          cp -r images _site/images
          cp -r pdf-menus-weasyprint _site/pdf-menus-weasyprint

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
