<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><title>Review card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap">
<style>
@page { size: A6; margin: 0 }
:root { --ink:#1b1b1b; --muted:#606060; --accent:#8b3a3a; --line:#d4c3a5; --bg:#fdfbf7 }
body { margin:0; width:105mm; height:148mm; background:var(--bg); color:var(--ink); font-family:'Montserrat',sans-serif; text-align:center; position:relative }
.in { position:absolute; inset:6mm; border:0.4mm solid var(--line); padding:8mm 6mm; box-sizing:border-box }
h1 { font-family:'Cormorant Garamond',serif; font-weight:700; font-size:24pt; margin:0 0 2mm; color:var(--accent) }
.sub { font-size:8pt; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:0 0 8mm }
p.big { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:15pt; margin:0 0 6mm; line-height:1.3 }
img { width:42mm; height:42mm }
.small { font-size:8pt; color:var(--muted); margin-top:5mm; line-height:1.5 }
</style></head><body><div class="in">
<h1>La Carbonara</h1>
<p class="sub">Lange Niezel 7 · Amsterdam</p>
<p class="big">Was het lekker?<br>Een review op Google helpt ons enorm.</p>
<img src="review_qr.svg" alt="QR">
<p class="small">Scan de code om naar ons Google-profiel te gaan.<br>Thank you, grazie.</p>
</div></body></html>
