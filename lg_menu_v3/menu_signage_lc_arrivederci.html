<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>La Carbonara - Arrivederci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --dark: #1c1917;
    --cream: #f5f0e8;
    --gold: #c8a55b;
  }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    color: var(--cream);
    background-color: var(--dark);
  }

  main {
    position: relative;
    width: 1080px;
    height: 1920px;
    background: url('../images/italian-flatlay.jpg') center / cover no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  main::before {
    content: '';
    position: absolute;
    inset: 0;
    background-color: rgba(28, 25, 23, 0.82);
    z-index: 1;
  }

  .clock {
    position: absolute;
    top: 40px;
    right: 60px;
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 1px;
    color: var(--cream);
    opacity: 0.35;
    z-index: 2;
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 80px;
    opacity: 0;
    animation: fadeIn 1.5s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .content {
      animation: none;
      opacity: 1;
    }
  }

  .kicker {
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    font-variant: small-caps;
  }

  .spacer-80 { height: 80px; }
  .spacer-60 { height: 60px; }
  .spacer-20 { height: 20px; }

  .proverb {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 52px;
    line-height: 1.25;
    color: var(--cream);
  }

  .translation {
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    font-weight: 300;
    opacity: 0.45;
    margin-top: 16px;
  }

  .rule {
    width: 60px;
    height: 1px;
    background-color: var(--gold);
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px;
    line-height: 1.3;
    color: var(--cream);
  }

  .location {
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    font-weight: 300;
    opacity: 0.5;
  }

  .no-reservations {
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--gold);
    opacity: 0.7;
  }

  .welcome {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 28px;
    color: var(--cream);
    margin-top: 12px;
  }

  .url {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 400;
    opacity: 0.25;
    color: var(--cream);
    z-index: 2;
  }
</style>
</head>
<body>
<main>
  <div class="clock" id="clock"></div>

  <div class="content">
    <span class="kicker">La Carbonara</span>

    <div class="spacer-80"></div>

    <p class="proverb">A tavola non si invecchia.</p>
    <p class="translation">At the table, one does not grow old.</p>

    <div class="spacer-60"></div>
    <div class="rule"></div>
    <div class="spacer-60"></div>

    <p class="tagline">Pasta fresca ogni giorno dalle 12:00</p>
    <div class="spacer-20"></div>
    <p class="location">Nel cuore di Amsterdam</p>

    <div class="spacer-80"></div>

    <p class="no-reservations">Niente prenotazioni</p>
    <p class="welcome">Benvenuti!</p>
  </div>

  <span class="url">lacarbonara.nl</span>
</main>

<script>
  (function () {
    var clockEl = document.getElementById('clock');
    function tick() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      clockEl.textContent = h + ':' + m;
    }
    tick();
    setInterval(tick, 10000);
    setTimeout(function () { location.reload(); }, 600000);
  })();
</script>
</body>
</html>
