<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>La Carbonara</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

html, body {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: #1c1917;
  color: #f5f0e8;
  font-family: 'Cormorant Garamond', serif;
}

main {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  width: 1080px;
  height: 1920px;
  padding: 60px 80px;
}

/* Header */
.header { text-align: center; }
.header h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 68px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: #f5f0e8;
  margin-bottom: 28px;
}
.rule {
  width: 50px;
  height: 1px;
  background: #c8a55b;
  margin: 0 auto;
}

/* Menu */
.menu {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  padding: 20px 0;
}

.item {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.item-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  font-weight: 400;
  color: #f5f0e8;
  white-space: nowrap;
}

.item-dots {
  flex: 1;
  border-bottom: 1px dotted rgba(245, 240, 232, 0.2);
  margin-bottom: 6px;
}

.item-price {
  font-family: 'Montserrat', sans-serif;
  font-size: 20px;
  font-weight: 400;
  color: #b85c38;
  white-space: nowrap;
}

/* Footer */
.footer { text-align: center; }
.footer .rule { margin-bottom: 28px; }

.footer-tagline {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 22px;
  color: #f5f0e8;
  opacity: 0.5;
  margin-bottom: 14px;
}

.footer-drinks {
  font-family: 'Montserrat', sans-serif;
  font-size: 15px;
  font-weight: 300;
  color: #f5f0e8;
  opacity: 0.3;
  margin-bottom: 10px;
}

.footer-hours {
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  font-weight: 300;
  color: #f5f0e8;
  opacity: 0.25;
}

/* Clock */
.clock {
  position: fixed;
  bottom: 20px;
  right: 30px;
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  font-weight: 300;
  color: #f5f0e8;
  opacity: 0.2;
}
</style>
</head>
<body>
<main>
  <header class="header">
    <h1>La Carbonara</h1>
    <div class="rule"></div>
  </header>

  <section class="menu">
    <div class="item">
      <span class="item-name">La Carbonara</span>
      <span class="item-dots"></span>
      <span class="item-price">19</span>
    </div>
    <div class="item">
      <span class="item-name">Cacio e Pepe</span>
      <span class="item-dots"></span>
      <span class="item-price">16</span>
    </div>
    <div class="item">
      <span class="item-name">Amatriciana</span>
      <span class="item-dots"></span>
      <span class="item-price">18</span>
    </div>
    <div class="item">
      <span class="item-name">Bolognese</span>
      <span class="item-dots"></span>
      <span class="item-price">18</span>
    </div>
    <div class="item">
      <span class="item-name">Pesto Genovese</span>
      <span class="item-dots"></span>
      <span class="item-price">17</span>
    </div>
    <div class="item">
      <span class="item-name">Quattro Formaggi</span>
      <span class="item-dots"></span>
      <span class="item-price">20</span>
    </div>
    <div class="item">
      <span class="item-name">Pesto Gamberetti</span>
      <span class="item-dots"></span>
      <span class="item-price">21</span>
    </div>
    
    
    <div class="item">
      <span class="item-name">Tagliere Formaggi</span>
      <span class="item-dots"></span>
      <span class="item-price">16</span>
    </div>
    <div class="item">
      <span class="item-name">Focaccia</span>
      <span class="item-dots"></span>
      <span class="item-price">6.50</span>
    </div>
    
  </section>

  <footer class="footer">
    <div class="rule"></div>
    <p class="footer-tagline">Pasta fresca ogni giorno</p>
    <p class="footer-drinks">Spritz e Cocktail 0.0% | Birra | Acqua</p>
    <p class="footer-hours">Aperto ogni giorno dalle 12:00</p>
  </footer>
</main>

<div class="clock" id="clock"></div>

<script>
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = h + ':' + m;
}
updateClock();
setInterval(updateClock, 30000);

setTimeout(function() { location.reload(); }, 3600000);
</script>
</body>
</html>
