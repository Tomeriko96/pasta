<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>La Carbonara - Menu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: #1c1917;
  color: #f5f0e8;
  font-family: 'Cormorant Garamond', serif;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

main {
  width: 1080px;
  height: 1920px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 100px;
  position: relative;
}

.clock {
  position: absolute;
  top: 40px;
  right: 100px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 300;
  font-size: 18px;
  color: #f5f0e8;
  opacity: 0.4;
}

.title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 72px;
  font-weight: 400;
  letter-spacing: 0.04em;
  text-align: center;
  color: #f5f0e8;
}

.rule {
  width: 40px;
  height: 1px;
  background: #c8a55b;
}

.menu-list {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.menu-item {
  display: flex;
  align-items: baseline;
  height: 90px;
}

.item-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 32px;
  font-weight: 400;
  color: #f5f0e8;
  white-space: nowrap;
  flex-shrink: 0;
}

.item-dots {
  flex: 1;
  border-bottom: 1px dotted rgba(245, 240, 232, 0.15);
  margin: 0 16px;
  position: relative;
  top: -6px;
}

.item-price {
  font-family: 'Montserrat', sans-serif;
  font-size: 22px;
  font-weight: 300;
  color: #b85c38;
  white-space: nowrap;
  flex-shrink: 0;
}

.tagline {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 24px;
  font-weight: 400;
  color: #f5f0e8;
  opacity: 0.4;
  text-align: center;
}

.drinks {
  font-family: 'Montserrat', sans-serif;
  font-size: 16px;
  font-weight: 300;
  color: #f5f0e8;
  opacity: 0.3;
  text-align: center;
  letter-spacing: 0.06em;
}

.gap-60 { height: 60px; flex-shrink: 0; }
.gap-40 { height: 40px; flex-shrink: 0; }
</style>
</head>
<body>
<main>
  <div class="clock" id="clock"></div>

  <h1 class="title">La Carbonara</h1>

  <div class="gap-60"></div>
  <div class="rule"></div>
  <div class="gap-60"></div>

  <div class="menu-list">
    <div class="menu-item">
      <span class="item-name">La Carbonara</span>
      <span class="item-dots"></span>
      <span class="item-price">19</span>
    </div>
    <div class="menu-item">
      <span class="item-name">Cacio e Pepe</span>
      <span class="item-dots"></span>
      <span class="item-price">16</span>
    </div>
    <div class="menu-item">
      <span class="item-name">Amatriciana</span>
      <span class="item-dots"></span>
      <span class="item-price">18</span>
    </div>
    <div class="menu-item">
      <span class="item-name">Pesto Genovese</span>
      <span class="item-dots"></span>
      <span class="item-price">17</span>
    </div>
    <div class="menu-item">
      <span class="item-name">Quattro Formaggi</span>
      <span class="item-dots"></span>
      <span class="item-price">20</span>
    </div>
    <div class="menu-item">
      <span class="item-name">Pesto Gamberetti</span>
      <span class="item-dots"></span>
      <span class="item-price">21</span>
    </div>
    
    <div class="menu-item">
      <span class="item-name">Tagliere Formaggi</span>
      <span class="item-dots"></span>
      <span class="item-price">16</span>
    </div>
  </div>

  <div class="gap-60"></div>
  <div class="rule"></div>
  <div class="gap-40"></div>

  <p class="tagline">Pasta fresca ogni giorno</p>
  <div class="gap-40"></div>
  <p class="drinks">Spritz e Cocktail 0.0% | Birra | Acqua</p>
</main>

<script>
(function() {
  var el = document.getElementById('clock');
  function tick() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    el.textContent = h + ':' + m;
  }
  tick();
  setInterval(tick, 30000);
  setTimeout(function() { location.reload(); }, 600000);
})();
</script>
</body>
</html>
