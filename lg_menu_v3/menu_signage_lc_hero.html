<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1">
<title>La Carbonara - Board 1 of 5</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg: #1c1917;
    --cream: #f5f0e8;
    --terracotta: #b85c38;
    --gold: #c8a55b;
  }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Montserrat', sans-serif;
  }

  main {
    width: 1080px;
    height: 1920px;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Clock */
  #clock {
    position: absolute;
    top: 32px;
    right: 60px;
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--cream);
    opacity: 0.7;
    z-index: 10;
    letter-spacing: 0.5px;
  }

  /* Top bar */
  .top-bar {
    position: absolute;
    top: 32px;
    left: 60px;
    z-index: 10;
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
    font-weight: 500;
    font-variant: small-caps;
    letter-spacing: 4px;
    color: var(--cream);
    opacity: 0.85;
  }

  /* Hero image area */
  .hero-image {
    width: 100%;
    height: 1056px; /* ~55% of 1920 */
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .hero-image-bg {
    position: absolute;
    inset: 0;
    background-image: url('../images/pasta-carbonara.jpg');
    background-size: cover;
    background-position: center;
    animation: kenburns 20s ease-in-out infinite alternate;
  }

  .hero-image::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: linear-gradient(to bottom, transparent, var(--bg));
    pointer-events: none;
  }

  @keyframes kenburns {
    0% {
      transform: scale(1) translate(0, 0);
    }
    100% {
      transform: scale(1.08) translate(-1%, -1%);
    }
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero-image-bg {
      animation: none;
    }
    .content-area, .bottom-tag {
      animation: none;
    }
  }

  /* Content below hero */
  .content-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 60px;
    text-align: center;
    gap: 0;
    margin-top: -40px;
    animation: fadeInUp 1.2s ease-out 0.3s both;
  }

  .restaurant-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 72px;
    font-weight: 600;
    color: var(--cream);
    line-height: 1.1;
    margin-bottom: 16px;
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 28px;
    font-weight: 400;
    color: var(--cream);
    opacity: 0.7;
    margin-bottom: 40px;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: var(--gold);
    border: none;
    margin-bottom: 40px;
  }

  .dish-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 600;
    color: var(--cream);
    margin-bottom: 8px;
  }

  .dish-price {
    font-family: 'Montserrat', sans-serif;
    font-size: 36px;
    font-weight: 500;
    color: var(--terracotta);
    margin-left: 16px;
  }

  .dish-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 16px;
    margin-bottom: 16px;
  }

  .dish-desc {
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    font-weight: 300;
    color: var(--cream);
    opacity: 0.6;
    line-height: 1.6;
  }

  /* Bottom tag */
  .bottom-tag {
    position: absolute;
    bottom: 48px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-style: italic;
    font-size: 14px;
    font-weight: 300;
    color: var(--cream);
    opacity: 0.5;
    animation: fadeInUp 1.2s ease-out 0.8s both;
  }
</style>
</head>
<body>
<main>
  <span id="clock"></span>
  <span class="top-bar">La Carbonara</span>

  <div class="hero-image">
    <div class="hero-image-bg"></div>
  </div>

  <div class="content-area">
    <h1 class="restaurant-name">La Carbonara</h1>
    <p class="subtitle">Pasta fresca, fatta a mano</p>
    <hr class="divider">
    <div class="dish-row">
      <span class="dish-name">La Carbonara</span>
      <span class="dish-price">&euro;19</span>
    </div>
    <p class="dish-desc">Guanciale, egg yolk, Pecorino Romano, black pepper</p>
  </div>

  <p class="bottom-tag">Pasta fresca ogni giorno</p>
</main>
<script>
  (function () {
    var clockEl = document.getElementById('clock');
    function tick() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      clockEl.textContent = h + ':' + m;
    }
    tick();
    setInterval(tick, 10000);
    setTimeout(function () { location.reload(); }, 600000);
  })();
</script>
</body>
</html>
