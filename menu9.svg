<text x="70"  y="629" font-size="13.5" font-weight="bold" fill="#1A1208">Arrabbiata  <tspan font-size="10" fill="#C83010">(S)</tspan></text>
<text x="220" y="629" font-size="10.5" fill="#9A7050" font-style="italic">Penne all'Arrabbiata</text>
<text x="752" y="629" text-anchor="end" font-size="11" fill="#3A2808">€12.50</text>
<text x="70"  y="646" font-size="10.5" fill="#5A4020" font-style="italic">San Marzano tomatoes, garlic, fresh chilli, flat-leaf parsley — hot &amp; fragrant</text>

