═══════════════════════════════════════ -->

<!-- section label -->
<text x="48" y="154"
      font-size="10" font-weight="bold" fill="#B83010"
      letter-spacing="5" style="font-variant:small-caps;">Starters &amp; Bruschetta</text>
<line x1="48" y1="160" x2="752" y2="160" stroke="#D4B896" stroke-width="0.7"/>
<text x="48" y="174"
      font-size="9.5" fill="#9A7050" font-style="italic">
  Freshly baked sourdough, toasted to order
</text>

<!-- 1 — Bruschetta with Heritage Tomatoes -->
<text x="48"  y="196" font-size="11" font-weight="bold" fill="#B83010">1</text>
<text x="70"  y="196" font-size="13.5" font-weight="bold" fill="#1A1208">Bruschetta with Heritage Tomatoes</text>
<text x="752" y="196" text-anchor="end" font-size="11" fill="#3A2808">€7.50</text>
<text x="70"  y="213" font-size="10.5" fill="#5A4020" font-style="italic">Slow-roasted heritage tomatoes, dried oregano, sea salt on stone-baked sourdough</text>

<!-- 2 — Bruschetta with Tomato &amp; Basil -->
<text x="48"  y="238" font-size="11" font-weight="bold" fill="#B83010">2</text>
<text x="70"  y="238" font-size="13.5" font-weight="bold" fill="#1A1208">Bruschetta with Tomato &amp; Basil</text>
<text x="752" y="238" text-anchor="end" font-size="11" fill="#3A2808">€7</text>
<text x="70"  y="255" font-size="10.5" fill="#5A4020" font-style="italic">Marinated plum tomatoes, garlic, torn basil, cold-pressed extra virgin olive oil</text>

<!-- 3 — Sourdough with Garlic &amp; Oil -->
<text x="48"  y="280" font-size="11" font-weight="bold" fill="#B83010">3</text>
<text x="70"  y="280" font-size="13.5" font-weight="bold" fill="#1A1208">Sourdough with Garlic &amp; Oil</text>
<text x="752" y="280" text-anchor="end" font-size="11" fill="#3A2808">€6.50</text>
<text x="70"  y="297" font-size="10.5" fill="#5A4020" font-style="italic">Stone-baked sourdough rubbed with fresh garlic, cold-pressed Sicilian olive oil</text>

<!-- ═══════════════════════════════════════
