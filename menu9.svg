<?xml version="1.0" encoding="UTF-8"?>
<!--
  menu9.svg — La Bella Pasta
  Design brief: casual · quick · tourist area · no alcohol
  Single laminated page · numbered items · English-primary · €-symbol kept
  Social proof at top · one featured box (Carbonara) · dietary legend at footer
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1080" viewBox="0 0 800 1080"
     font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif">
<defs>
  <pattern id="grain" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.4" fill="#8b6020" opacity="0.04"/>
    <circle cx="3" cy="3" r="0.4" fill="#8b6020" opacity="0.03"/>
  </pattern>
  <linearGradient id="featuredBg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#fff4e6"/>
    <stop offset="100%" stop-color="#fdf8f0"/>
  </linearGradient>
  <filter id="cardshadow">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
  </filter>
</defs>

<!-- ─── BACKGROUND ─── -->
<rect width="800" height="1080" fill="#FEFAF3"/>
<rect width="800" height="1080" fill="url(#grain)"/>

<!-- ═══════════════════════════════════════
     TOP ACCENT BAR
═══════════════════════════════════════ -->
<rect x="0" y="0" width="800" height="6" fill="#B83010"/>

<!-- ═══════════════════════════════════════
     HEADER  y=6–132
     Compact — social proof integrated directly.
     Tourists need confidence before they browse.
═══════════════════════════════════════ -->

<!-- restaurant name -->
<text x="400" y="56"
      text-anchor="middle"
      font-size="46" font-weight="bold" fill="#1A1208"
      letter-spacing="6" style="font-variant:small-caps;">La Bella Pasta</text>

<!-- double rule -->
<line x1="90"  y1="68" x2="710" y2="68" stroke="#D4B896" stroke-width="1.5"/>
<line x1="130" y1="73" x2="670" y2="73" stroke="#B83010" stroke-width="0.6"/>

<!-- tagline -->
<text x="400" y="92"
      text-anchor="middle"
      font-size="11" fill="#7A5030" font-style="italic" letter-spacing="2.5">
  Autentica Cucina Italiana · Est. 1987
</text>

<!-- social proof — one line, compact, at top where trust is built first -->
<text x="400" y="112"
      text-anchor="middle"
      font-size="10" fill="#4A3010" letter-spacing="0.3">
  ⭐ 4.8 · 3,200 reviews · TripAdvisor #1 Old Town · "Best Pasta in the City" – La Cucina Magazine
</text>

<!-- bottom rule of header -->
<line x1="48" y1="124" x2="752" y2="124" stroke="#D4B896" stroke-width="0.8"/>

<!-- ═══════════════════════════════════════
