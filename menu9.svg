  All pasta rolled fresh in our kitchen daily · Gluten-free pasta available — please ask
</text>

<!-- 4 — Bolognese (ANCHOR — highest price, listed first to set reference) -->
<text x="48"  y="380" font-size="11" font-weight="bold" fill="#B83010">4</text>
<text x="70"  y="380" font-size="13.5" font-weight="bold" fill="#1A1208">Bolognese</text>
<text x="234" y="380" font-size="10.5" fill="#9A7050" font-style="italic">Tagliatelle al Ragù</text>
<text x="752" y="380" text-anchor="end" font-size="11" fill="#3A2808">€15</text>
<text x="70"  y="397" font-size="10.5" fill="#5A4020" font-style="italic">Slow-cooked beef &amp; pork ragù, San Marzano tomatoes, Parmigiano Reggiano</text>

<!-- 5 — Carbonara — FEATURED (star of the menu, one box only) -->
<!-- left accent bar + subtle warm tint — casual version of the featured treatment -->
<rect x="48" y="413" width="704" height="72" rx="4"
      fill="url(#featuredBg)" filter="url(#cardshadow)"/>
<rect x="48" y="413" width="5"   height="72" rx="2" fill="#B83010"/>

<text x="64"  y="433" font-size="11" font-weight="bold" fill="#B83010">5</text>
<text x="86"  y="433" font-size="13.5" font-weight="bold" fill="#1A1208">Carbonara</text>
<rect x="214" y="421" width="126" height="16" rx="8" fill="#B83010"/>
<text x="277" y="432" text-anchor="middle" font-size="8.5" font-weight="bold" fill="white" letter-spacing="0.8">⭐  OUR FAVOURITE</text>
<text x="348" y="433" font-size="10.5" fill="#9A7050" font-style="italic">Spaghetti alla Carbonara</text>
<text x="752" y="433" text-anchor="end" font-size="11" fill="#3A2808">€14.50</text>

<text x="86"  y="451" font-size="10.5" fill="#5A4020" font-style="italic">Cured pork cheek (guanciale), egg yolk, Pecorino Romano, Parmigiano, black pepper</text>
<text x="86"  y="469" font-size="9.5"  fill="#9A7050">No cream, ever · Prepared strictly to order</text>

<!-- 6 — Amatriciana -->
<text x="48"  y="503" font-size="11" font-weight="bold" fill="#B83010">6</text>
<text x="70"  y="503" font-size="13.5" font-weight="bold" fill="#1A1208">Amatriciana</text>
<text x="210" y="503" font-size="10.5" fill="#9A7050" font-style="italic">Rigatoni all'Amatriciana</text>
<text x="752" y="503" text-anchor="end" font-size="11" fill="#3A2808">€13.50</text>
<text x="70"  y="520" font-size="10.5" fill="#5A4020" font-style="italic">Cured pork cheek (guanciale), San Marzano tomatoes, Pecorino Romano, white wine  (H)</text>

<!-- 7 — Puttanesca -->
<text x="48"  y="545" font-size="11" font-weight="bold" fill="#B83010">7</text>
<text x="70"  y="545" font-size="13.5" font-weight="bold" fill="#1A1208">Puttanesca</text>
<text x="204" y="545" font-size="10.5" fill="#9A7050" font-style="italic">Casareccia alla Puttanesca</text>
<text x="752" y="545" text-anchor="end" font-size="11" fill="#3A2808">€13.50</text>
<text x="70"  y="562" font-size="10.5" fill="#5A4020" font-style="italic">Anchovies, capers, Gaeta olives, garlic, pepperoncino, tomato sauce</text>

<!-- 8 — Pesto Genovese -->
<text x="48"  y="587" font-size="11" font-weight="bold" fill="#B83010">8</text>
<text x="70"  y="587" font-size="13.5" font-weight="bold" fill="#1A1208">Pesto Genovese  <tspan font-size="10" fill="#2a7a2a">(V)</tspan></text>
<text x="752" y="587" text-anchor="end" font-size="11" fill="#3A2808">€13</text>
<text x="70"  y="604" font-size="10.5" fill="#5A4020" font-style="italic">Fresh basil, toasted pine nuts, Parmigiano Reggiano, Pecorino, garlic, cold-pressed EVOO</text>

