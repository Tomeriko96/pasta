═══════════════════════════════════════ -->

<text x="48" y="338"
      font-size="10" font-weight="bold" fill="#B83010"
      letter-spacing="5" style="font-variant:small-caps;">Pasta</text>
<line x1="48" y1="344" x2="752" y2="344" stroke="#D4B896" stroke-width="0.7"/>
<text x="48" y="358"
