<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1080" viewBox="0 0 800 1080"
     font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif">
<defs>
  <pattern id="grain" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.5" fill="#7a5c28" opacity="0.055"/>
    <circle cx="3" cy="3" r="0.5" fill="#7a5c28" opacity="0.035"/>
  </pattern>
  <linearGradient id="featuredBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#fffbf0"/>
    <stop offset="100%" stop-color="#fdf0d5"/>
  </linearGradient>
  <linearGradient id="darkBadge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#4a0808"/>
    <stop offset="100%" stop-color="#2e0505"/>
  </linearGradient>
  <filter id="shadow">
    <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/>
  </filter>
</defs>

<!-- ─── BACKGROUND ─── -->
<rect width="800" height="1080" fill="#f7f3ec"/>
<rect width="800" height="1080" fill="url(#grain)"/>

<!-- top stripe -->
