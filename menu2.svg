<text x="52" y="211" font-size="13.5" font-weight="bold" fill="#1c120a">Bruschetta con Pomodori Heritage</text>
<text x="748" y="211" text-anchor="end" font-size="11" fill="#7a5c30">7.50</text>
<text x="52" y="227" font-size="11"   fill="#5c4020" font-style="italic">Slow-roasted heritage tomatoes, dried oregano, sea salt, stone-baked sourdough</text>

