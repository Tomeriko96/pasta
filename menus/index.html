<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Gallery: pick the best</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #222; }
  body { display: flex; height: 100vh; overflow: hidden; }

  aside {
    width: 300px;
    flex: 0 0 300px;
    background: #1f1a14;
    color: #efe9dd;
    overflow-y: auto;
    padding: 16px 0 40px;
  }
  aside h1 { font-size: 16px; padding: 4px 18px 12px; color: #f3ead7; border-bottom: 1px solid #3a332a; margin-bottom: 8px; }
  aside .hint { font-size: 11px; color: #b9ad97; padding: 0 18px 12px; line-height: 1.4; }

  .group { margin-bottom: 6px; }
  .group > .group-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: #d8b98a; padding: 10px 18px 4px; font-weight: 700;
  }
  .versions { display: flex; flex-wrap: wrap; gap: 5px; padding: 2px 14px 8px; }
  .versions a {
    display: inline-block; min-width: 34px; text-align: center;
    padding: 5px 8px; font-size: 12px; border-radius: 4px;
    background: #2e281f; color: #efe9dd; text-decoration: none; border: 1px solid #3a332a;
  }
  .versions a:hover { background: #43392b; }
  .versions a.active { background: #d8b98a; color: #1f1a14; border-color: #d8b98a; font-weight: 700; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .bar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: #f3ead7; border-bottom: 1px solid #d9cdb6;
  }
  .bar .label { font-weight: 700; font-size: 14px; color: #7a2e1d; }
  .bar .spacer { flex: 1; }
  .bar a, .bar button {
    font-size: 13px; text-decoration: none; color: #1f1a14;
    background: #fff; border: 1px solid #c4b28f; border-radius: 4px;
    padding: 6px 12px; cursor: pointer;
  }
  .bar a:hover, .bar button:hover { background: #fbf7ef; }

  .frame-wrap { flex: 1; background: #d7d0c2; overflow: auto; display: flex; justify-content: center; padding: 20px; }
  iframe { width: 210mm; min-height: 297mm; border: none; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,0.25); }

  .empty { margin: auto; color: #6b5d45; font-size: 15px; text-align: center; }
</style>
</head>
<body>
  <aside>
    <h1>Menu Gallery</h1>
    <p class="hint">Click a version to preview it on the right. Use "Open full page" to view it alone, or "Print / PDF" to save.</p>
    <div id="nav"></div>
  </aside>

  <main>
    <div class="bar">
      <span class="label" id="current">Select a menu</span>
      <span class="spacer"></span>
      <a id="openFull" href="#" target="_blank" rel="noopener">Open full page</a>
      <button id="printBtn">Print / PDF</button>
    </div>
    <div class="frame-wrap">
      <iframe id="preview" title="menu preview"></iframe>
      <div class="empty" id="empty">Pick a menu version from the left to preview it here.</div>
    </div>
  </main>

<script>
const AGENTS = ["tourist", "designer", "connoisseur", "owner"];
const AGENT_LABELS = {
  tourist: "Tourist friendly",
  designer: "Graphic designer",
  connoisseur: "Italian connoisseur",
  owner: "Restaurant owner"
};

async function listMenuFiles() {
  // Read the pre-generated manifest (scripts/gen_gallery_manifest.sh writes it).
  const res = await fetch("./menus.json", { cache: "no-store" });
  if (!res.ok) throw new Error("menus.json not found");
  const files = await res.json();
  return files.filter(h => /^menu_.*\.html$/.test(h) && h !== "index.html");
}

function versionOf(file) {
  const m = file.match(/_v(\d+)\.html$/);
  return m ? parseInt(m[1], 10) : 1;
}
function agentOf(file) {
  const m = file.match(/^menu_([a-z]+?)(?:_v\d+)?\.html$/);
  return m ? m[1] : "other";
}

function build(files) {
  const groups = {};
  for (const f of files) {
    const a = agentOf(f);
    (groups[a] = groups[a] || []).push(f);
  }
  const nav = document.getElementById("nav");
  const order = [...AGENTS.filter(a => groups[a]), ...Object.keys(groups).filter(a => !AGENTS.includes(a))];
  for (const a of order) {
    const list = groups[a].sort((x, y) => versionOf(x) - versionOf(y));
    const g = document.createElement("div");
    g.className = "group";
    const t = document.createElement("div");
    t.className = "group-title";
    t.textContent = AGENT_LABELS[a] || a;
    g.appendChild(t);
    const vs = document.createElement("div");
    vs.className = "versions";
    for (const f of list) {
      const link = document.createElement("a");
      link.href = "#" + f;
      link.textContent = "v" + versionOf(f);
      link.dataset.file = f;
      link.dataset.label = (AGENT_LABELS[a] || a) + " v" + versionOf(f);
      link.addEventListener("click", e => { e.preventDefault(); select(f, link); });
      vs.appendChild(link);
    }
    g.appendChild(vs);
    nav.appendChild(g);
  }
  return groups;
}

let activeLink = null;
function select(file, link) {
  const frame = document.getElementById("preview");
  const empty = document.getElementById("empty");
  frame.src = "./" + file;
  frame.style.display = "block";
  empty.style.display = "none";
  document.getElementById("current").textContent = link.dataset.label;
  document.getElementById("openFull").href = "./" + file;
  if (activeLink) activeLink.classList.remove("active");
  link.classList.add("active");
  activeLink = link;
  location.hash = file;
}

document.getElementById("printBtn").addEventListener("click", () => {
  const frame = document.getElementById("preview");
  if (frame.src) { frame.contentWindow.focus(); frame.contentWindow.print(); }
});

listMenuFiles().then(files => {
  if (!files.length) {
    document.getElementById("empty").textContent = "No menu files found in this folder.";
    return;
  }
  build(files);
  // Deep-link support: open the hash target, else the newest tourist menu.
  const target = decodeURIComponent(location.hash.replace(/^#/, ""));
  const links = [...document.querySelectorAll(".versions a")];
  const first = links.find(l => l.dataset.file === target) || links[links.length - 1];
  if (first) select(first.dataset.file, first);
});
</script>
</body>
</html>
