<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Gallery: pick the best</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #222; }
  body { display: flex; height: 100vh; overflow: hidden; }

  aside {
    width: 300px; flex: 0 0 300px;
    background: #1f1a14; color: #efe9dd; overflow-y: auto; padding: 16px 0 40px;
  }
  aside h1 { font-size: 16px; padding: 4px 18px 12px; color: #f3ead7; border-bottom: 1px solid #3a332a; }
  aside .hint { font-size: 11px; color: #b9ad97; padding: 0 18px 12px; line-height: 1.4; }

  .group { margin-bottom: 10px; }
  .group > .group-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #d8b98a; padding: 12px 18px 4px; font-weight: 700; }
  .versions { display: flex; flex-wrap: wrap; gap: 5px; padding: 2px 14px 8px; }
  .versions button {
    min-width: 34px; text-align: center; padding: 5px 8px; font-size: 12px;
    border-radius: 4px; background: #2e281f; color: #efe9dd; border: 1px solid #3a332a; cursor: pointer;
  }
  .versions button:hover { background: #43392b; }
  .versions button.active { background: #d8b98a; color: #1f1a14; border-color: #d8b98a; font-weight: 700; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: #f3ead7; border-bottom: 1px solid #d9cdb6;
  }
  .bar .label { font-weight: 700; font-size: 14px; color: #7a2e1d; }
  .bar .pos { font-size: 12px; color: #6b5d45; }
  .bar .spacer { flex: 1; }
  .bar a, .bar button {
    font-size: 13px; text-decoration: none; color: #1f1a14; background: #fff;
    border: 1px solid #c4b28f; border-radius: 4px; padding: 6px 12px; cursor: pointer;
  }
  .bar a:hover, .bar button:hover { background: #fbf7ef; }

  .frame-wrap { flex: 1; background: #d7d0c2; overflow: auto; display: flex; justify-content: center; padding: 20px; }
  iframe { width: 210mm; min-height: 297mm; border: none; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,0.25); }

  .empty { margin: auto; color: #6b5d45; font-size: 15px; text-align: center; max-width: 320px; }
  .arrow {
    position: fixed; top: 50%; transform: translateY(-50%); width: 52px; height: 80px;
    background: rgba(31,26,20,0.78); color: #fff; border: none; border-radius: 8px;
    font-size: 30px; cursor: pointer; z-index: 20; display: flex; align-items: center; justify-content: center;
  }
  .arrow:hover { background: rgba(31,26,20,0.95); }
  #prev { left: 310px; }
  #next { right: 20px; }
</style>
</head>
<body>
  <aside>
    <h1>Menu Gallery</h1>
    <p class="hint">Pick a version from any section. Use the arrows or left/right keys to flip through every menu.</p>
    <div id="nav"></div>
  </aside>

  <main>
    <div class="bar">
      <span class="label" id="current">Select a menu</span>
      <span class="pos" id="pos"></span>
      <span class="spacer"></span>
      <a id="openFull" href="#" target="_blank" rel="noopener">Open full page</a>
      <button id="printBtn">Print / PDF</button>
    </div>
    <div class="frame-wrap">
      <div class="empty" id="empty">Pick a menu version from the left to preview it here.</div>
      <iframe id="preview" title="menu preview" style="display:none"></iframe>
    </div>
  </main>

  <button id="prev" class="arrow" title="Previous (Left arrow)">&#8249;</button>
  <button id="next" class="arrow" title="Next (Right arrow)">&#8250;</button>

<script>
const SECTIONS = [
  { key: "agent",   title: "Agent menus" },
  { key: "print",   title: "Print menus" },
  { key: "signage", title: "Signage (LG)" }
];

async function loadManifest() {
  const res = await fetch("./menus.json", { cache: "no-store" });
  if (!res.ok) throw new Error("menus.json not found");
  return res.json();
}

function agentOf(name) {
  const m = name.match(/^menu_([a-z]+?)(?:_v\d+)?\.html$/);
  return m ? m[1] : "other";
}
function versionOf(name) {
  const m = name.match(/_v(\d+)\.html$/);
  if (m) return parseInt(m[1], 10);
  if (name === "menu_improved.html") return 0;
  if (name.startsWith("menu_agentic")) return 1;
  return 1;
}
function labelOf(entry) {
  const n = entry.name;
  if (entry.section === "agent") {
    const a = agentOf(n);
    const map = { tourist: "Tourist", designer: "Designer", connoisseur: "Connoisseur", owner: "Owner" };
    return (map[a] || a) + " v" + versionOf(n);
  }
  if (entry.section === "print") {
    return n.replace("menu_", "").replace(".html", "").replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  }
  return "LG Signage";
}

let ORDER = [];
let POS = -1;
let activeBtn = null;

function buildNav(entries) {
  const nav = document.getElementById("nav");
  for (const sec of SECTIONS) {
    const list = entries
      .filter(e => e.section === sec.key)
      .sort((a, b) => labelOf(a).localeCompare(labelOf(b), undefined, { numeric: true }));
    if (!list.length) continue;
    const g = document.createElement("div"); g.className = "group";
    const t = document.createElement("div"); t.className = "group-title"; t.textContent = sec.title; g.appendChild(t);
    const vs = document.createElement("div"); vs.className = "versions";
    for (const e of list) {
      const btn = document.createElement("button");
      btn.textContent = (sec.key === "print") ? labelOf(e) : "v" + versionOf(e.name);
      btn.title = labelOf(e);
      btn.addEventListener("click", () => goTo(ORDER.findIndex(x => x === e)));
      vs.appendChild(btn);
    }
    g.appendChild(vs); nav.appendChild(g);
  }
}

function goTo(idx) {
  if (idx < 0 || idx >= ORDER.length) return;
  POS = idx;
  const entry = ORDER[POS];
  const frame = document.getElementById("preview");
  frame.src = "/" + entry.file;
  frame.style.display = "block";
  document.getElementById("empty").style.display = "none";
  document.getElementById("current").textContent = labelOf(entry);
  document.getElementById("pos").textContent = "  (" + (POS + 1) + " / " + ORDER.length + ")";
  document.getElementById("openFull").href = "/" + entry.file;
  if (activeBtn) activeBtn.classList.remove("active");
  // highlight the matching sidebar button by matching title+text
  const btns = [...document.querySelectorAll(".versions button")];
  activeBtn = btns.find(b => b.title === labelOf(entry)) || null;
  if (activeBtn) activeBtn.classList.add("active");
  history.replaceState(null, "", "#" + entry.file);
}

document.getElementById("prev").addEventListener("click", () => goTo(POS - 1));
document.getElementById("next").addEventListener("click", () => goTo(POS + 1));
document.getElementById("printBtn").addEventListener("click", () => {
  const f = document.getElementById("preview");
  if (f.src) { f.contentWindow.focus(); f.contentWindow.print(); }
});
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") goTo(POS - 1);
  if (e.key === "ArrowRight") goTo(POS + 1);
});

loadManifest().then(entries => {
  if (!entries.length) { document.getElementById("empty").textContent = "No menu files found."; return; }
  ORDER = entries;
  buildNav(entries);
  const target = decodeURIComponent(location.hash.replace(/^#/, ""));
  const start = ORDER.findIndex(e => e.file === target);
  goTo(start >= 0 ? start : 0);
}).catch(err => {
  document.getElementById("empty").textContent = "Could not load menus.json. Run: make gallery";
});
</script>
</body>
</html>
