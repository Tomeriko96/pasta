<!DOCTYPE html>
<html lang="en">
<head>

<style>
  @font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:400 700;font-display:swap;src:url(/fonts/cormorant-garamond.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Montserrat';font-style:normal;font-weight:300 600;font-display:swap;src:url(/fonts/montserrat.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

  :root {
    --ink: #1b1b1b;
    --muted: #5c5c5c;
    --accent: #8b3a3a;
    --line: #d4c3a5;
    --bg: #fdfbf7;
    --paper: #e8dfd0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    margin: 8px 28px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
    align-self: flex-start;
  }

  header { border-bottom: 1px solid var(--line); }

  main {
    flex: 1;
    text-align: center;
    padding: 72px 28px;
  }

  .eyebrow {
    font-size: 13px;
    letter-spacing: 3.2px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 44px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    line-height: 1;
  }

  p.lead {
    max-width: 440px;
    margin: 20px auto 0;
    font-size: 17px;
    line-height: 1.6;
  }

  .buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 32px;
  }

  .btn {
    display: inline-block;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    text-decoration: none;
    padding: 16px 30px;
    border: 1px solid var(--ink);
  }

  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fdfbf7; }
  .btn-primary:hover { background: #75302f; }
  .btn-outline { color: var(--ink); background: transparent; }
  .btn-outline:hover { background: var(--ink); color: var(--bg); }

  footer {
    text-align: center;
    padding: 28px;
    font-size: 15px;
    color: var(--muted);
    line-height: 1.9;
  }

  @media (max-width: 480px) {
    h1 { font-size: 34px; }
    main { padding: 56px 20px; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/">La Carbonara</a>
  </header>

  <main>
    <div class="eyebrow">Error 404</div>
    <h1>Page not found</h1>
    <p class="lead">This page does not exist. The menu and our address are on the home page.</p>
    <div class="buttons">
      <a class="btn btn-primary" href="/#menu">View Menu</a>
      <a class="btn btn-outline" href="https://www.google.com/maps/dir/?api=1&amp;destination=Lange+Niezel+7+Amsterdam">Get Directions</a>
    </div>
  </main>

  <footer>
    <p>La Carbonara &middot; Lange Niezel 7, Amsterdam</p>
    <p>Open daily, 12:00 to 23:00. No reservations.</p>
  </footer>
</div>
</body>
</html>
