<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100"
     font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#1c0f07"/>
    <stop offset="100%" stop-color="#110806"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#f5c84a"/>
    <stop offset="50%"  stop-color="#d4943a"/>
    <stop offset="100%" stop-color="#b07620"/>
  </linearGradient>
  <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
