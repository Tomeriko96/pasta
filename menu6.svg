    <circle cx="2.5" cy="2.5" r="0.4"  fill="#ffffff" opacity="0.012"/>
  </pattern>
  <filter id="shadow">
    <feDropShadow dx="1" dy="2" stdDeviation="4" flood-color="#00000060"/>
  </filter>
</defs>

<!-- ─── BACKGROUND ─── -->
